name: Flutter
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run auth gate test
        run: flutter test test/main_auth_gate_test.dart
      - name: Run utility tests
        run: flutter test test/views/utils

  test-performance-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run performance smoke tests
        run: flutter test test/performance/auth_gate_performance_test.dart test/performance/main_page_performance_test.dart

  test-visual-goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run visual smoke tests
        run: flutter test test/performance/main_page_visual_smoke_test.dart
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: repz/test/performance/failures
          if-no-files-found: ignore

  refresh-linux-goldens:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Update Linux goldens
        run: flutter test --update-goldens test/performance/main_page_visual_smoke_test.dart
      - name: Upload refreshed goldens
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-linux-goldens
          path: repz/test/performance/goldens
          if-no-files-found: error
      - name: Commit refreshed goldens
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: refresh Linux goldens"
          file_pattern: repz/test/performance/goldens/*.png
