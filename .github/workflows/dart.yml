name: Flutter
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run auth gate test
        run: flutter test test/main_auth_gate_test.dart
      - name: Run utility tests
        run: flutter test test/views/utils

  test-performance-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run performance smoke tests
        run: flutter test test/performance/auth_gate_performance_test.dart test/performance/main_page_performance_test.dart

  test-compatibility-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repz
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run compatibility smoke tests
        run: flutter test test/compatibility

  build:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test-core
      - test-performance-smoke
      - test-compatibility-smoke
    steps:
      - name: Enforce required checks
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "analyze failed"
            exit 1
          fi
          if [ "${{ needs.test-core.result }}" != "success" ]; then
            echo "test-core failed"
            exit 1
          fi
          if [ "${{ needs.test-performance-smoke.result }}" != "success" ]; then
            echo "test-performance-smoke failed"
            exit 1
          fi
          if [ "${{ needs.test-compatibility-smoke.result }}" != "success" ]; then
            echo "test-compatibility-smoke failed"
            exit 1
          fi
          echo "Required CI checks passed."
